[project]
name = "script_orchestrator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.15"
# Core deps — always needed regardless of which workflow engine is orchestrated.
dependencies = [
    "dagster",
    "dagster-cloud",
    "python-dotenv",
    "pyyaml",
    "gitpython",
    "pydantic",
    "requests",
    "beautifulsoup4",
    "griffe>=2.0.0",
]

[project.optional-dependencies]
# Pick only the engines you actually orchestrate.
# `pip install script-orchestrator[prefect]` for Prefect-only demos, etc.
prefect = ["prefect>=3.0.0"]
airflow = ["apache-airflow>=2.8.0"]
dask = [
    "dask[distributed]>=2026.1.2",
    "dagster-dask>=0.28.14",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=23.0.0",
]
pyspark = ["pyspark>=4.1.1"]
all = [
    "script_orchestrator[prefect,airflow,dask,pyspark]",
]
dev = [
    "dagster-webserver",
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "script_orchestrator"

[tool.dagster]
module_name = "script_orchestrator.definitions"
registry_modules = ["script_orchestrator.components"]

[tool.setuptools.packages.find]
exclude=["script_orchestrator_tests"]

[dependency-groups]
dev = [
    "dagster-webserver>=1.12.14",
]
