enabled: true
script_type: spark
description: "Spark job for large-scale data processing (market maker rules)"
group: python_examples
owners:
  - data-eng@company.com
tags:
  environment: production
  compute_type: spark
  team: data-engineering
kinds:
  - spark

# No schedule - triggered by sensor/event
# schedule:
#   cron_schedule: "0 4 * * *"
#   timezone: "UTC"
#   default_status: "RUNNING"

depends_on:
  - extract_data  # Runs after data extraction

retry_policy:
  max_retries: 3
  delay: 120  # Wait 2min before retry
  backoff: "EXPONENTIAL"
  jitter: "FULL"
