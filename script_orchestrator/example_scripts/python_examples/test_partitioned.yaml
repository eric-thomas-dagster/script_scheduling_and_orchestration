enabled: true
script_type: python
description: "Daily data processing script with date partitioning"
group: python_examples
tags:
  type: test
  demonstrates: partitioned_asset
  schedule: daily
kinds:
  - python

# Partition configuration - makes this a partitioned asset
partition:
  parameter: date          # The script parameter to use as partition key
  schedule: daily          # daily, weekly, monthly, or hourly
  start_date: "2024-01-01" # Optional: start date for partitions (defaults to 30 days ago)
  timezone: "America/New_York"  # Optional: timezone (defaults to UTC)
  date_format: "%Y-%m-%d"  # Optional: date format for passing to script (defaults to %Y-%m-%d)
