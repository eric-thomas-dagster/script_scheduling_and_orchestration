type: script_orchestrator.components.ScriptGithubComponent

# ─────────────────────────────────────────────────────────────────────────────
# Orchestrate Prefect's own demo repo (https://github.com/PrefectHQ/demos) as
# Dagster assets.  This exercises the full Prefect → Dagster mapping path:
#   • plain @flow / @task scripts wrap as graph_assets (like today)
#   • @materialize scripts (Prefect ≥3.4) surface as multi_assets with real
#     AssetKeys, dep edges, owners, descriptions, urls, kinds, and runtime
#     metadata captured from add_asset_metadata() calls
#
# The demo repo uses git submodules to source most of its example scripts;
# ScriptGithubComponent clones with --recurse-submodules so the symlinks
# resolve to real files.
# ─────────────────────────────────────────────────────────────────────────────

attributes:
  repo_url: https://github.com/PrefectHQ/demos
  repo_branch: main
  github_token: null       # set via GITHUB_TOKEN for private forks
  scripts_directory: .   # Prefect demo scripts live at the repo root, not in a demos/ subdir
  use_local: false

  # ── Script types ─────────────────────────────────────────────────────────
  # Airflow disabled — this repo is Prefect only.
  airflow_enabled: false

  prefect_enabled: true
  # Prefect assets (@materialize / Asset / AssetProperties / add_asset_metadata)
  # were introduced in Prefect 3.4.  Anything earlier will error on the
  # `from prefect.assets import ...` line at import time.
  # Prefect 2.x and 3.x are NOT wire-compatible — pinning to a 3.x floor keeps
  # the demos runnable and unlocks the asset primitives.
  prefect_version: null    # use whatever prefect version is pip-installed
  prefect_auto_install: true

  # ── Cosmos / dbt ─────────────────────────────────────────────────────────
  # Prefect demos don't ship a dbt project, so leave Cosmos routing off.
  dbt_project_path: ""

  # Auto-derive freshness SLAs from the flow's own schedule cron.
  auto_freshness_policies: true

  # ── Per-file overrides ────────────────────────────────────────────────────
  # `demos/*/prefect.yaml` are Prefect deployment configs, not scripts —
  # skip them so they don't get wrapped as assets.  Add more entries here to
  # tune schedules or descriptions per demo.
  file_overrides:
    prefect:
      enabled: false          # prefect.yaml is a deployment config, not a script

    # Lineage / metadata for PrefectHQ/demos scripts (we don't own that repo,
    # so we express these in defs.yaml rather than committing companion .yaml
    # files there). Requires script-orchestrator commit ac7f795 or later.
    model_training:
      description: "Train a churn model on nightly customer features."
      owners: ["ml-platform@example.com"]
      kinds: ["ml", "s3"]
      group_name: "ml_pipeline"

    model_inference:
      description: "Score today's customer batch against the latest churn model."
      owners: ["ml-platform@example.com"]
      kinds: ["ml", "s3"]
      group_name: "ml_pipeline"
      depends_on: [model_training]      # ← real Dagster deps= edge

    my_data_pipeline:
      description: "ETL: raw HTTP source → cleaned parquet."
      owners: ["data-eng@example.com"]
      group_name: "etl"

    my_workflow:
      description: "Downstream aggregation of the my_data_pipeline output."
      owners: ["data-eng@example.com"]
      group_name: "etl"
      depends_on: [my_data_pipeline]    # ← lineage arrow

    repo_analysis:
      description: "Nightly repo stats — starred repos, contributor counts."
      owners: ["dev-tools@example.com"]
      kinds: ["http", "github"]
      group_name: "reporting"

    simulate_failures:
      description: "Chaos-testing flow — deliberately fails to demo retry policies."
      owners: ["platform-sre@example.com"]
      group_name: "chaos_tests"

  # ── Airflow connections / variables (unused for Prefect) ─────────────────
  connections: {}
  airflow_variables: {}
