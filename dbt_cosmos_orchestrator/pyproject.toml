[project]
name = "dbt_cosmos_orchestrator"
version = "0.1.0"
description = "Dagster project that converts Astronomer Cosmos (Airflow+dbt) DAGs to native Dagster dbt assets"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster",
    "dagster-cloud",
    "dagster-dbt",
    "dagster-webserver",
    "dagster-dg-cli",
    "dbt-core",
    "dbt-postgres",  # default adapter; swap for dbt-duckdb, dbt-snowflake, etc.
    "requests",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver",
    "pytest",
    "dbt-duckdb",  # useful for local dev without a real database
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dbt_cosmos_orchestrator"

[tool.dagster]
module_name = "dbt_cosmos_orchestrator"
registry_modules = ["dbt_cosmos_orchestrator.components"]

[tool.setuptools.packages.find]
exclude = ["dbt_cosmos_orchestrator_tests"]
